name: twmt-probe
on: workflow_dispatch
concurrency:
  group: twmt-probe
jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y libsecp256k1-dev libssl-dev
      - run: gcc -O3 -march=native -pthread twmt.c -o twmt -lsecp256k1 -lcrypto && TW_WORDS=words.txt ./twmt --bench 20000
      - run: TW_WORDS=words.txt TW_ORACLE=oracle.bin TW_THREADS=4 timeout 300 ./twmt --range 100000000 101500000 pcur.txt phits.tsv 2>&1 | tail -4
